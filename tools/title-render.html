/* ---------- Moon horizon with Mars rising (own drawing), or any background picture ---------- */
function moonHorizon(W, H, cx, cy, R){
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'), img = g.createImageData(W, H), d = img.data;
  const n1 = noise2(W, H, 160), n2 = noise2(W, H, 40), n3 = noise2(W, H, 9), cr = [];
  for (let k = 0; k < 420; k++) cr.push([rnd()*W, cy - R + 20 + Math.pow(rnd(), .7)*(H - (cy - R)), 2 + Math.pow(rnd(), 3)*46]);
  const rays = [[W*.36, H*.86], [W*.08, H*1.02]];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x - cx)/R, dy = (y - cy)/R, rr = dx*dx + dy*dy, i = (y*W + x)*4; if (rr > 1) continue;
    const z = Math.sqrt(1 - rr), fore = Math.min(1, (y - (cy - R))/(H*.5));      // squash craters near the horizon

    for (const [qx, qy, qr] of cr) { const ex = (x - qx)/qr, ey = (y - qy)/(qr*(.25 + .75*fore)), e = Math.hypot(ex, ey); if (e < 1) t += ey < 0 ? -.2*(1 - e*e) : -.06*(1 - e*e); else if (e < 1.18) t += (ey < 0 ? .06 : .22)*(1.18 - e)/.18; }
