<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Arial, Helvetica, sans-serif">
  <!-- How Curiosity's two labs work: the drill makes powder, a sieve sends a pinch to CheMin (minerals, X-rays)
       and SAM (oven + three gas detectors). Drawn for Crater Crew; simplified, not to scale. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c9a8"/><stop offset="1" stop-color="#f6e3cf"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98657"/><stop offset="1" stop-color="#9c5b36"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f6"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c0c8"/><stop offset="1" stop-color="#6f767e"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4d98a"/><stop offset=".5" stop-color="#c99a3a"/><stop offset="1" stop-color="#8a6320"/></linearGradient>
    <linearGradient id="rtg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a5f66"/><stop offset=".5" stop-color="#9aa2aa"/><stop offset="1" stop-color="#4a4f55"/></linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2733"/><stop offset="1" stop-color="#121a23"/></linearGradient>
    <radialGradient id="glowX" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd0c8"/><stop offset="1" stop-color="#e8484a"/></radialGradient>
    <radialGradient id="oven" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#ffe08a"/><stop offset=".6" stop-color="#ff8a3d"/><stop offset="1" stop-color="#b8431a"/></radialGradient>
    <pattern id="tread" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#3a3f45"/><path d="M0 5 L5 0 L10 5" stroke="#5d636a" stroke-width="2" fill="none"/></pattern>
  </defs>
  <rect width="960" height="600" fill="url(#sky)"/>
  <path d="M0 250 Q120 215 260 238 T520 228 T780 240 T960 226 V330 H0Z" fill="#d9a37a" opacity=".55"/>
  <path d="M0 445 Q240 425 480 440 T960 432 V600 H0Z" fill="url(#ground)"/>
  <g fill="#7a4428" opacity=".5"><ellipse cx="640" cy="520" rx="26" ry="7"/><ellipse cx="860" cy="486" rx="18" ry="5"/><ellipse cx="380" cy="560" rx="22" ry="6"/></g>
  <text x="480" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#2a2420">The two labs inside Curiosity</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#6b5a4c">How a rock becomes a science result, in four steps</text>

  <!-- target rock with drill hole -->
  <path d="M40 452 Q60 392 128 392 Q190 394 206 452Z" fill="#8d5232"/><path d="M60 440 Q100 420 180 428" stroke="#6e3c22" stroke-width="3" fill="none"/>
  <circle cx="132" cy="408" r="5" fill="#3a1d10"/><path d="M118 404 Q132 396 146 404" stroke="#b7a19a" stroke-width="2" fill="none"/>

  <!-- rover: wheels and rocker-bogie -->
  <g>
    <path d="M330 368 L420 330 L520 368 M520 368 L600 336 L700 368 M600 336 L640 300" stroke="#55595f" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g><circle cx="330" cy="408" r="40" fill="url(#tread)" stroke="#2a2d31" stroke-width="3"/><circle cx="330" cy="408" r="15" fill="url(#metal)"/></g>
    <g><circle cx="520" cy="408" r="40" fill="url(#tread)" stroke="#2a2d31" stroke-width="3"/><circle cx="520" cy="408" r="15" fill="url(#metal)"/></g>
    <g><circle cx="700" cy="408" r="40" fill="url(#tread)" stroke="#2a2d31" stroke-width="3"/><circle cx="700" cy="408" r="15" fill="url(#metal)"/></g>
    <!-- power pack (MMRTG) at the back -->
    <g transform="rotate(-28 790 250)"><rect x="770" y="190" width="42" height="96" rx="8" fill="url(#rtg)"/>
      <g stroke="#3a3f45" stroke-width="3"><path d="M770 205 H812 M770 222 H812 M770 239 H812 M770 256 H812 M770 273 H812"/></g></g>
    <!-- body -->
    <path d="M300 200 H760 L780 226 V318 Q780 330 768 330 H300 Q288 330 288 318 V212 Q288 200 300 200Z" fill="url(#body)" stroke="#8d949c" stroke-width="3"/>
    <rect x="300" y="190" width="460" height="14" rx="4" fill="#d7dce1" stroke="#8d949c" stroke-width="2"/>
    <!-- high-gain antenna on deck -->
    <rect x="700" y="160" width="8" height="32" fill="#8d949c"/><ellipse cx="704" cy="154" rx="32" ry="10" fill="#e9eef3" stroke="#8d949c" stroke-width="2"/>
    <!-- mast and head -->
    <rect x="352" y="96" width="14" height="96" fill="url(#metal)"/>
    <rect x="322" y="70" width="80" height="32" rx="6" fill="url(#body)" stroke="#8d949c" stroke-width="2.5"/>
    <circle cx="390" cy="86" r="9" fill="#2a2d31"/><circle cx="390" cy="86" r="4" fill="#7fb2e6"/>
    <rect x="330" y="78" width="20" height="16" rx="3" fill="#2a2d31"/><rect x="354" y="78" width="12" height="16" rx="3" fill="#2a2d31"/>
    <!-- arm and turret with drill, at the rock -->
    <path d="M300 288 L230 300 L190 344 L150 360" stroke="url(#metal)" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="230" cy="300" r="10" fill="#6f767e"/><circle cx="190" cy="344" r="9" fill="#6f767e"/>
    <rect x="118" y="350" width="52" height="34" rx="7" fill="#5d636a" stroke="#2a2d31" stroke-width="2"/>
    <rect x="128" y="384" width="9" height="22" fill="#c9a227"/><path d="M128 388 H137 M128 394 H137 M128 400 H137" stroke="#8a6320" stroke-width="1.5"/>
    <rect x="148" y="384" width="16" height="12" rx="3" fill="#3a3f45"/>
  </g>

  <!-- cut-away window into the body -->
  <rect x="404" y="212" width="352" height="110" rx="8" fill="url(#cut)" stroke="#f0bf5a" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- CheMin inside -->
  <g>
    <rect x="414" y="222" width="150" height="72" rx="6" fill="#163c38" stroke="#3aa595" stroke-width="2"/>
    <rect x="422" y="250" width="30" height="16" rx="4" fill="url(#glowX)"/>
    <path d="M452 258 L488 258" stroke="#ff7b6c" stroke-width="3"/>
    <circle cx="494" cy="258" r="13" fill="#2b5d57" stroke="#9fe3d6" stroke-width="1.5"/>
    <g fill="#f2d27a"><circle cx="494" cy="247" r="2.5"/><circle cx="504" cy="252" r="2.5"/><circle cx="504" cy="264" r="2.5"/><circle cx="494" cy="269" r="2.5"/><circle cx="484" cy="264" r="2.5"/><circle cx="484" cy="252" r="2.5"/></g>
    <path d="M500 256 L540 240 M500 258 L542 258 M500 260 L540 276" stroke="#ff7b6c" stroke-width="1.6" stroke-dasharray="3 3"/>
    <rect x="542" y="236" width="10" height="44" fill="#0b1015" stroke="#9fe3d6" stroke-width="1.5"/>
    <text x="489" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#9fe3d6">CheMin</text>
  </g>
  <!-- SAM inside -->
  <g>
    <rect x="574" y="222" width="174" height="72" rx="6" fill="#2d1f40" stroke="#9a5ee0" stroke-width="2"/>
    <circle cx="600" cy="266" r="16" fill="#3e2b58" stroke="#c7a6f0" stroke-width="1.5"/>
    <g fill="#c7a6f0"><circle cx="600" cy="254" r="2"/><circle cx="611" cy="259" r="2"/><circle cx="611" cy="272" r="2"/><circle cx="600" cy="278" r="2"/><circle cx="589" cy="272" r="2"/><circle cx="589" cy="259" r="2"/></g>
    <rect x="622" y="254" width="22" height="24" rx="5" fill="url(#oven)"/>
    <path d="M644 262 Q652 252 660 262 T676 262" stroke="#c7a6f0" stroke-width="2" fill="none"/>
    <circle cx="690" cy="248" r="9" fill="none" stroke="#c7a6f0" stroke-width="2"/><path d="M684 248 Q690 240 696 248 Q690 256 684 248" stroke="#c7a6f0" stroke-width="1.2" fill="none"/>
    <rect x="682" y="262" width="22" height="12" rx="3" fill="#5a2f8a" stroke="#c7a6f0" stroke-width="1.2"/>
    <rect x="712" y="244" width="28" height="36" rx="4" fill="#3e2b58" stroke="#c7a6f0" stroke-width="1.2"/><path d="M716 252 L736 272 M736 252 L716 272" stroke="#ff7b6c" stroke-width="1" opacity=".8"/>
    <path d="M676 262 L682 262 M676 262 Q680 248 681 248 M704 268 L712 268" stroke="#c7a6f0" stroke-width="1.5" fill="none"/>
    <text x="661" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#c7a6f0">SAM</text>
  </g>
  <!-- inlets on the deck and the powder path -->
  <rect x="478" y="186" width="24" height="10" rx="2" fill="#3a3f45"/><rect x="646" y="186" width="24" height="10" rx="2" fill="#3a3f45"/>
  <path d="M144 350 Q170 140 490 150 L490 186" fill="none" stroke="#c9a227" stroke-width="4" stroke-dasharray="9 7"/>
  <path d="M144 350 Q200 112 658 130 L658 186" fill="none" stroke="#c9a227" stroke-width="4" stroke-dasharray="9 7"/>
  <g fill="#c9a227"><circle cx="490" cy="176" r="3"/><circle cx="486" cy="168" r="2"/><circle cx="658" cy="176" r="3"/><circle cx="662" cy="168" r="2"/></g>

  <!-- step labels -->
  <g font-size="13" fill="#2a2420">
    <circle cx="44" cy="190" r="14" fill="#2a2420"/><text x="44" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="64" y="187" font-weight="700" font-size="15">Drill</text><text x="64" y="204">The arm drills a hole</text><text x="64" y="220">and collects rock powder.</text>
    <circle cx="440" cy="94" r="14" fill="#2a2420"/><text x="440" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="460" y="91" font-weight="700" font-size="15">Sieve and drop</text><text x="460" y="108">A pinch, finer than flour, drops into two small inlets.</text>
  </g>
  <!-- step 3 and 4: result cards -->
  <g>
    <rect x="20" y="470" width="450" height="116" rx="12" fill="#ffffff" stroke="#3aa595" stroke-width="2"/>
    <circle cx="42" cy="492" r="13" fill="#3aa595"/><text x="42" y="497" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="62" y="490" font-size="15" font-weight="700" fill="#1f5a52">CheMin: which minerals?</text>
    <text x="62" y="508" font-size="12" fill="#3a332e">The powder shakes in a tiny cell while</text>
    <text x="62" y="523" font-size="12" fill="#3a332e">X-rays shine through it. Each mineral</text>
    <text x="62" y="538" font-size="12" fill="#3a332e">bends them in its own pattern of rings.</text>
    <text x="62" y="560" font-size="12" font-weight="700" fill="#1f5a52">Found: clay, made in water</text>
    <g transform="translate(420 528)"><circle r="30" fill="#0b1015"/><circle r="8" fill="none" stroke="#9fe3d6" stroke-width="2"/><circle r="15" fill="none" stroke="#9fe3d6" stroke-width="1.5" opacity=".8"/><circle r="22" fill="none" stroke="#9fe3d6" stroke-width="1" opacity=".6"/><circle r="27" fill="none" stroke="#9fe3d6" stroke-width="1" opacity=".4"/></g>
  </g>
  <g>
    <rect x="490" y="470" width="450" height="116" rx="12" fill="#ffffff" stroke="#9a5ee0" stroke-width="2"/>
    <circle cx="512" cy="492" r="13" fill="#9a5ee0"/><text x="512" y="497" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="532" y="490" font-size="15" font-weight="700" fill="#5a2f8a">SAM: any organic molecules?</text>
    <text x="532" y="508" font-size="12" fill="#3a332e">An oven bakes the powder until it gives</text>
    <text x="532" y="523" font-size="12" fill="#3a332e">off gas. Three detectors "sniff" the gas</text>
    <text x="532" y="538" font-size="12" fill="#3a332e">to find out what it is made of.</text>
    <text x="532" y="560" font-size="12" font-weight="700" fill="#5a2f8a">Found: carbon-based molecules</text>
    <g transform="translate(856 506)"><rect x="0" y="0" width="70" height="44" rx="4" fill="#0b1015"/>
      <path d="M6 38 L14 36 L18 18 L22 36 L32 34 L36 10 L40 34 L50 36 L54 24 L58 36 L64 37" fill="none" stroke="#c7a6f0" stroke-width="1.8"/></g>
  </g>
  <!-- labels for the parts inside -->
  <g font-size="10.5" fill="#e6ecf1" text-anchor="middle">
    <text x="437" y="284">X-ray tube</text><text x="494" y="314">sample wheel</text><text x="547" y="292">detector</text>
    <text x="600" y="314">sample cups</text><text x="633" y="290">oven</text><text x="700" y="314">gas detectors</text>
  </g>
  <text x="944" y="22" text-anchor="end" font-size="11" fill="#8a7464">Drawing: Crater Crew · simplified, not to scale</text>
</svg>
